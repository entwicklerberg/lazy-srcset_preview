<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            font-size: 12px;
        }

        body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #fff;
            color: #111;
        }

        #gallery {
            width: 100%;
        }

        .hero {
            height: 1px;
            overflow: hidden;
        }


        .srcset {
            width: 100%;
        }


        .lazy-srcset {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        .is-loading {
            opacity: 1;
            filter: blur(10px);
            transform: scale(1.02);
            transition: filter 0.3s ease,
            transform 0.3s ease;
        }

        .lazy-srcset.is-loaded {
            filter: blur(0);
            transform: scale(1);
        }

        .lazy-srcset:first-child,
        .srcset:first-child img {
            filter: none;
            transform: none;
        }

    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
          content="Automatically generates placeholders, srcset, sizes, and lazy loading to reduce image bandwidth and improve Core Web Vitals.">
    <meta name="keywords" content="webp, gallery, images, responsive, srcset, lazy loading, sharp, image optimization">
